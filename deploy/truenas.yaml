# TrueNAS SCALE 25.10 — Install via YAML, application unique : media-hub.
# Remplacer 192.0.2.10 par l'IP LAN du NAS joignable depuis Caddy.
# Dataset dedie /mnt/Main/tank/concierge : ecriture autorisee a UID/GID 65532.
# Ne pas installer les deux variantes simultanement : remplacer le YAML de la meme app.
# Images edge publiees apres validation de main. Re-pull avant de redeployer.
# Budgets CPU/RAM initiaux : ajuster apres une charge representative (docs/deployment.md).
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  api:
    <<: *runtime
    image: ghcr.io/hloiseau/le-concierge:edge
    container_name: le-concierge-api
    cpus: 1.0
    mem_limit: 256m
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: https://hub.hugoloiseau.fr
      # Facultatif au premier lancement ; remplir pour activer la connexion.
      DISCORD_CLIENT_ID: ''
      DISCORD_GUILD_ID: ''
      DATABASE_PATH: /app/data/concierge.db
      LISTEN_ADDR: ':8080'
      GOMEMLIMIT: 192MiB
      # Secret OAuth2, different du token de bot. Vide = liaison Discord desactivee (Plex reste disponible).
      DISCORD_CLIENT_SECRET: ''
      ADMIN_DISCORD_IDS: ''
      # DM de rappel facultatifs : activation serveur ET consentement individuel.
      DISCORD_DMS_ENABLED: 'false'
      # Salon de rappels : mentions des demandeurs Seerr, independant des DM.
      DISCORD_NOTIFICATION_CHANNEL_ID: ''
      DISCORD_BOT_TOKEN: '' # Preferer _FILE avec un secret monte en lecture seule.
      # Renseigner les deux valeurs d'une paire, ou laisser les deux vides.
      # Exemple PLEX_URL : http://192.0.2.10:32400
      # Connexion obligatoire au Hub : renseigner URL + identifiant du serveur.
      PLEX_URL: ''
      PLEX_SERVER_ID: ''
      SEERR_URL: ''
      SEERR_API_KEY: ''
      # Facultatif : departs personnels et rappels, sources en lecture seule.
      MAINTAINERR_URL: ''
      TAUTULLI_URL: ''
      TAUTULLI_API_KEY: ''
      # Livres : HTTPS et identifiants OPDS personnels, saisis dans le Hub.
      GRIMMORY_URL: ''
      SHELFMARK_URL: ''
      # Downloadarr : HTTPS + revision Git complete de l'image compatible installee.
      DOWNLOADARR_URL: ''
      DOWNLOADARR_REVISION: ''
      # Mesures optionnelles ; fichiers sur un volume distinct monte en lecture seule.
      MONITORING_ENABLED: '' # Auto avec Tautulli, Toparr ou METRICS_FILE ; false pour desactiver.
      METRICS_FILE: ''
      TOPARR_URL: '' # API Toparr existante, sans nouvel acces materiel.
      # Diagnostic administrateur : URL + cle de la meme instance Seerr HD/4K.
      RADARR_URL: ''
      RADARR_API_KEY: ''
      SONARR_URL: ''
      SONARR_API_KEY: ''
      # Publication explicitement selectionnee, voir docs/community-publication.md.
      COMMUNITY_FEED_FILE: ''
      COMMUNITY_SYNC_MANIFEST: ''
      COMMUNITY_FORUM_IDS: ''
      ROADMAP_ISSUE_IDS: ''
      # Liens publics HTTPS des boutons ; aucun secret ici.
      SERVICE_LINKS_JSON: >-
        {"plex":"https://app.plex.tv","seerr":"","downloadarr":"","torrent-watch":"","shelfmark":"","grimmory":""}
    volumes:
      - type: bind
        source: /mnt/Main/tank/concierge
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /app/api, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  hub:
    <<: *runtime
    image: ghcr.io/hloiseau/le-hub:edge
    container_name: le-hub
    cpus: 1.0
    mem_limit: 512m
    environment:
      NODE_OPTIONS: '--max-old-space-size=384'
      HOST: 0.0.0.0
      PORT: '3000'
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_DEMO: 'false'
      NUXT_PUBLIC_DISCORD_URL: '' # Lien d'invitation Discord facultatif.
    ports:
      - '192.0.2.10:18080:3000'
    tmpfs: [/tmp]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
