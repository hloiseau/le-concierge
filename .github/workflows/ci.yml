name: Validate and package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Test isolated metrics collector
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: make build
      - name: Validate TrueNAS deployment files
        run: |
          docker compose -f deploy/truenas.yaml config --quiet
          docker compose -f deploy/truenas-discord.yaml config --quiet
          bash -n deploy/truenas-admin.sh
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deployment-smoke:
    timeout-minutes: 12
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated TrueNAS configuration
        run: |
          mkdir -p /tmp/concierge-ci-data
          sudo chown 65532:65532 /tmp/concierge-ci-data
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('deploy/truenas-discord.yaml').read_text()
          for old, new in {
              '192.0.2.10': '127.0.0.1',
              '/mnt/Main/tank/concierge': '/tmp/concierge-ci-data',
              'REMPLACER_PAR_APPLICATION_ID': '12345',
              'REMPLACER_PAR_ID_SERVEUR_DISCORD': '23456',
              'REMPLACER_PAR_PUBLIC_KEY_HEXADECIMALE': '00' * 32,
              'REMPLACER_PAR_SECRET_ALEATOIRE_64_CARACTERES': 'ci-only-' * 8,
          }.items():
              text = text.replace(old, new)
          text = re.sub(r'ghcr.io/hloiseau/le-concierge:[^\s]+', 'concierge-ci:test', text)
          # An optional Discord feature without its token must not stop the Hub.
          text = text.replace("DISCORD_DMS_ENABLED: 'false'", "DISCORD_DMS_ENABLED: 'true'")
          text = text.replace("DISCORD_NOTIFICATION_CHANNEL_ID: ''", "DISCORD_NOTIFICATION_CHANNEL_ID: '34567'")
          Path('/tmp/concierge-ci.yaml').write_text(text)
          PY
      - name: Build the API and bot under test
        run: docker build -t concierge-ci:test .
      - name: Pull the published Hub image
        timeout-minutes: 3
        run: docker compose -p concierge-ci -f /tmp/concierge-ci.yaml pull hub
      - name: Start tested API and bot with TrueNAS settings
        timeout-minutes: 3
        run: docker compose -p concierge-ci -f /tmp/concierge-ci.yaml up -d --pull never --wait --wait-timeout 120
      - name: Check health, private routes and proxy
        run: |
          bash deploy/truenas-admin.sh check
          curl --fail http://127.0.0.1:18080/healthz
          python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:18080/api/v1/capabilities') as response:
              capabilities = json.load(response)
          assert capabilities['discordDMs'] is False
          assert capabilities['discordChannelReminders'] is False
          PY
          for route in services requests recent preferences departures reminders subscriptions books book-collections monitoring community roadmap admin/diagnostics; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/$route)" = 401
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18081/interactions -d '{}')" = 401
      - name: Show logs on failure
        if: failure()
        run: docker compose -p concierge-ci -f /tmp/concierge-ci.yaml logs --tail 100
      - name: Stop isolated containers
        if: always()
        run: docker compose -p concierge-ci -f /tmp/concierge-ci.yaml down --volumes
